<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About — YHN® Digital Art Archive</title>
    <meta name="description" content="YHN® — 个人介绍与简历" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="scroll-progress" id="scrollProgress"></div>

    <header class="site-header">
      <a class="brand" href="./index.html">
        <span class="brand-mark">YHN</span>
        <span>Digital Art Archive</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="top-nav" id="topNav" aria-label="主导航">
        <a href="./index.html">Home</a>
        <a href="./works.html">Works</a>
        <a href="./about.html" class="is-active">About</a>
        <a href="./terminal.html">Terminal</a>
      </nav>
    </header>

    <div class="sub-nav">
      <a class="back-button" id="backButton" href="./index.html" data-fallback="./index.html">← 返回</a>
      <nav class="breadcrumb" aria-label="页面路径">
        <a href="./index.html">Home</a>
        <span class="crumb-sep">›</span>
        <span class="crumb-current">About</span>
      </nav>
    </div>

    <main class="sub-page" id="top">
      <section class="page-hero">
        <p class="eyebrow">About / Profile</p>
        <h1>关于我</h1>
      </section>

      <section class="section about-section">
        <div>
          <p class="eyebrow">Bio</p>
        </div>
        <div class="about-copy">
          <p id="aboutBio"></p>
          <ul class="skill-tags" id="aboutSkills" aria-label="技能标签"></ul>
        </div>
      </section>

      <section class="section about-block">
        <h2>教育背景</h2>
        <div class="about-timeline" id="aboutEducation">
          <p class="detail-empty">待补充。</p>
        </div>
      </section>

      <section class="section about-block">
        <h2>项目与实习经历</h2>
        <div class="about-timeline" id="aboutExperience">
          <p class="detail-empty">待补充。</p>
        </div>
      </section>

      <section class="section about-block">
        <h2>竞赛与荣誉</h2>
        <div class="about-timeline" id="aboutAwards">
          <p class="detail-empty">待补充。</p>
        </div>
      </section>

      <section class="section about-block">
        <h2>简历下载</h2>
        <div class="contact-panel">
          <a id="resumeLink" href="#" style="opacity:0.5;pointer-events:none;">
            📄 简历 PDF <small>（待上传）</small>
          </a>
        </div>
      </section>

      <section class="section about-block">
        <h2>联系方式</h2>
        <div class="contact-panel" id="contactLinks"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span class="footer-brand">YHN® Digital Art Archive</span>
        <span class="footer-note">© 2026 杨蕙咛</span>
      </div>
    </footer>

    <script src="./data.js"></script>
    <script>
      (function() {
        document.getElementById("aboutBio").textContent = profile.bio;
        document.getElementById("aboutSkills").innerHTML =
          profile.skills.map(s => "<li>" + s + "</li>").join("");

        const emailLink = profile.email
          ? '<a href="mailto:' + profile.email + '">' + profile.email + '</a>'
          : '<a href="#" style="opacity:0.5;pointer-events:none;">邮箱（待补充）</a>';
        document.getElementById("contactLinks").innerHTML = emailLink;

        if (profile.resume) {
          const rl = document.getElementById("resumeLink");
          rl.href = profile.resume;
          rl.style.opacity = "";
          rl.style.pointerEvents = "";
          rl.innerHTML = "📄 下载简历 PDF";
        }
      })();
    </script>
    <script src="./script.js"></script>
  </body>
</html>
