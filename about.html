<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关于 — YHN® Digital Art Archive</title>
    <meta name="description" content="YHN® — 个人介绍与简历" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="scroll-progress" id="scrollProgress"></div>

    <header class="site-header">
      <a class="brand" href="./index.html">
        <span class="brand-mark">YHN</span>
        <span>Archive</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-divider"></div>
      <nav class="top-nav" id="topNav" aria-label="主导航">
        <a href="./index.html"><span class="nav-num">01</span>首页</a>
        <a href="./works.html"><span class="nav-num">02</span>作品集</a>
        <a href="./about.html" class="is-active" aria-current="page"><span class="nav-num">03</span>关于</a>
        <a href="./terminal.html"><span class="nav-num">04</span>终端</a>
      </nav>
    </header>

    <main class="sub-page" id="top">
      <section class="page-hero">
        <p class="eyebrow">关于 / 个人简介</p>
        <h1>关于我</h1>
      </section>

      <section class="section about-section">
        <div>
          <p class="eyebrow">Bio</p>
        </div>
        <div class="about-copy">
          <p id="aboutBio"></p>
          <p class="detail-summary" id="aboutTitle"></p>
          <ul class="skill-tags" id="aboutSkills" aria-label="技能标签"></ul>
        </div>
      </section>

      <section class="section about-block">
        <h2>教育背景</h2>
        <div class="about-timeline" id="aboutEducation">
          <div class="about-placeholder"><span class="placeholder-tag">EMPTY</span><span>此模块暂无数据，待后续补充。</span></div>
        </div>
      </section>

      <section class="section about-block">
        <h2>项目与实习经历</h2>
        <div class="about-timeline" id="aboutExperience">
          <div class="about-placeholder"><span class="placeholder-tag">EMPTY</span><span>此模块暂无数据，待后续补充。</span></div>
        </div>
      </section>

      <section class="section about-block">
        <h2>竞赛与荣誉</h2>
        <div class="about-timeline" id="aboutAwards">
          <div class="about-placeholder"><span class="placeholder-tag">EMPTY</span><span>此模块暂无数据，待后续补充。</span></div>
        </div>
      </section>

      <section class="section about-block">
        <h2>简历下载</h2>
        <div class="contact-panel" id="resumePanel">
          <div class="about-placeholder">
            <span class="placeholder-tag">PENDING</span>
            <span>简历 PDF 尚未上传。</span>
          </div>
        </div>
      </section>

      <section class="section about-block">
        <h2>联系方式</h2>
        <div class="contact-panel" id="contactPanel"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span class="footer-brand">YHN® Digital Art Archive</span>
        <span class="footer-note">© 2026 杨蕙咛</span>
      </div>
    </footer>

    <script src="./data.js"></script>
    <script>
      (function() {
        document.getElementById("aboutBio").textContent = profile.bio;
        document.getElementById("aboutTitle").textContent = "求职方向：" + profile.title;
        document.getElementById("aboutSkills").innerHTML =
          profile.skills.map(s => "<li>" + s + "</li>").join("");

        if (profile.resume) {
          const resumePanel = document.getElementById("resumePanel");
          resumePanel.innerHTML = "";
          const resumeLink = document.createElement("a");
          resumeLink.href = profile.resume;
          resumeLink.download = "";
          resumeLink.textContent = "📄 下载简历 PDF";
          resumePanel.appendChild(resumeLink);
        }

        const socialLabels = {
          bilibili: "Bilibili",
          artstation: "ArtStation",
          behance: "Behance"
        };
        const contactLinks = [];
        if (profile.email) {
          contactLinks.push('<a href="mailto:' + profile.email + '">' + profile.email + '</a>');
        }
        Object.keys(profile.social).forEach(function(key) {
          if (profile.social[key]) {
            contactLinks.push('<a href="' + profile.social[key] + '" target="_blank" rel="noopener noreferrer">' + socialLabels[key] + ' ↗</a>');
          }
        });
        if (!contactLinks.length) {
          contactLinks.push('<div class="about-placeholder"><span class="placeholder-tag">PENDING</span><span>真实邮箱与社交链接待补充。</span></div>');
        }
        document.getElementById("contactPanel").innerHTML = contactLinks.join("");
      })();
    </script>
    <script src="./script.js"></script>
  </body>
</html>
