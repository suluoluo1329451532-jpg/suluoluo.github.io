<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project — YHN® Digital Art Archive</title>
    <meta name="description" content="YHN® Digital Art Archive — 作品详情" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="scroll-progress" id="scrollProgress"></div>

    <header class="site-header">
      <a class="brand" href="./index.html">
        <span class="brand-mark">YHN</span>
        <span>Archive</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-divider"></div>
      <nav class="top-nav" id="topNav" aria-label="主导航">
        <a href="./index.html"><span class="nav-num">01</span>首页</a>
        <a href="./works.html" class="is-active" aria-current="page"><span class="nav-num">02</span>作品集</a>
        <a href="./about.html"><span class="nav-num">03</span>关于我</a>
        <a href="./terminal.html"><span class="nav-num">04</span>终端</a>
      </nav>
    </header>

    <main class="sub-page" id="top">
      <div id="projectNotFound" style="display:none;padding:140px 20px;text-align:center;">
        <p class="eyebrow">404</p>
        <h2>未找到该作品</h2>
        <p style="margin:16px 0;color:var(--muted);">请求的项目不存在或已被移除。</p>
        <a class="button secondary" href="./works.html">返回作品集</a>
      </div>

      <article id="projectDetail" style="display:none">
        <section class="detail-hero">
          <div class="detail-hero-top">
            <a class="button secondary detail-back" href="./works.html">← 返回作品集</a>
            <p class="detail-code" id="detailCode"></p>
          </div>
          <div class="detail-hero-media">
            <div class="detail-carousel" id="detailCarousel" role="group" aria-roledescription="carousel" aria-label="作品媒体轮播">
              <div class="detail-carousel-stage">
                <div class="detail-carousel-track" id="detailCarouselTrack"></div>
              </div>
              <button class="detail-carousel-button detail-carousel-prev" id="detailCarouselPrev" type="button" aria-label="上一个媒体">←</button>
              <button class="detail-carousel-button detail-carousel-next" id="detailCarouselNext" type="button" aria-label="下一个媒体">→</button>
              <div class="detail-carousel-dots" id="detailCarouselDots"></div>
              <p class="detail-carousel-status" id="detailCarouselStatus" aria-live="polite"></p>
            </div>
          </div>
          <div class="detail-hero-content">
            <p class="eyebrow" id="detailCategory"></p>
            <h1 id="detailTitle"></h1>
            <p class="detail-summary" id="detailSummary" style="display:none"></p>
            <dl class="detail-meta" id="detailMeta"></dl>
          </div>
        </section>

        <section class="section detail-section">
          <div id="detailModules"></div>
        </section>

        <section class="section detail-links" id="detailLinksSection" style="display:none">
          <h2>外部链接</h2>
          <div class="contact-panel" id="detailLinks"></div>
        </section>

        <section class="section detail-nav">
          <a class="button secondary" href="./works.html">← 返回作品集</a>
          <div id="adjacentNav"></div>
        </section>
      </article>
    </main>
    <div class="detail-lightbox" id="detailLightbox" aria-hidden="true">
      <div class="detail-lightbox-backdrop" id="detailLightboxBackdrop"></div>
      <button class="detail-lightbox-close" id="detailLightboxClose" type="button" aria-label="关闭预览">×</button>
      <div class="detail-lightbox-body">
        <img id="detailLightboxImg" src="" alt="" />
        <p class="detail-lightbox-caption" id="detailLightboxCaption"></p>
      </div>
    </div>

    <footer class="site-footer">
      <div class="footer-inner">
        <span class="footer-brand">YHN® Digital Art Archive</span>
        <span class="footer-note">© 2026 杨蕙咛</span>
      </div>
    </footer>

    <script src="./data.js"></script>
    <script>
      (function() {
        const params = new URLSearchParams(window.location.search);
        const slug = params.get("id");
        const project = projects.find(p => p.slug === slug);

        const notFound = document.getElementById("projectNotFound");
        const detail = document.getElementById("projectDetail");

        if (!project) {
          notFound.style.display = "";
          document.title = "404 — YHN®";
          return;
        }

        notFound.style.display = "none";
        detail.style.display = "";

        document.title = project.title + " — YHN® Digital Art Archive";
        document.getElementById("detailCode").textContent = project.code || project.category;
        document.getElementById("detailCategory").textContent = project.category;
        document.getElementById("detailTitle").textContent = project.title;
        const summaryEl = document.getElementById("detailSummary");
        if (project.summary && !(project.modules && project.modules.overview)) {
          summaryEl.textContent = project.summary;
          summaryEl.style.display = "";
        }

        const carouselRoot = document.getElementById("detailCarousel");
        const carouselTrack = document.getElementById("detailCarouselTrack");
        const carouselStage = carouselTrack.parentElement;
        const carouselDots = document.getElementById("detailCarouselDots");
        const carouselPrev = document.getElementById("detailCarouselPrev");
        const carouselNext = document.getElementById("detailCarouselNext");
        const carouselStatus = document.getElementById("detailCarouselStatus");
        carouselTrack.innerHTML = "";
        carouselDots.innerHTML = "";

        const carouselItems = [];
        (project.media || []).forEach(item => {
          if ((item.type === "image" || item.type === "video") && item.src) {
            carouselItems.push(item);
          }
        });
        if (!carouselItems.length && project.cover) {
          carouselItems.push({ type: "image", src: project.cover, alt: project.title });
        }

        const carouselSlides = [];
        const carouselDotButtons = [];
        let carouselIndex = 0;

        const updateCarousel = function(nextIndex) {
          if (!carouselSlides.length) return;
          carouselIndex = (nextIndex + carouselSlides.length) % carouselSlides.length;
          carouselTrack.style.transform = "translateX(-" + (carouselIndex * 100) + "%)";
          carouselSlides.forEach((slide, index) => {
            const isActive = index === carouselIndex;
            slide.classList.toggle("is-active", isActive);
            slide.setAttribute("aria-hidden", isActive ? "false" : "true");
            const video = slide.querySelector("video");
            if (video && !isActive) {
              video.pause();
            }
          });
          carouselDotButtons.forEach((dot, index) => {
            dot.classList.toggle("is-active", index === carouselIndex);
            dot.setAttribute("aria-current", index === carouselIndex ? "true" : "false");
          });
          carouselStatus.textContent = String(carouselIndex + 1).padStart(2, "0") + " / " + String(carouselSlides.length).padStart(2, "0");
        };

        carouselItems.forEach((item, index) => {
          const slide = document.createElement("div");
          slide.className = "detail-carousel-slide";
          slide.setAttribute("aria-hidden", index === 0 ? "false" : "true");
          slide.setAttribute("role", "group");
          slide.setAttribute("aria-label", "媒体 " + (index + 1));

          const typeTag = document.createElement("span");
          typeTag.className = "detail-carousel-type";
          typeTag.textContent = item.type === "video" ? "VIDEO" : "IMAGE";
          slide.appendChild(typeTag);

          if (item.type === "video") {
            const video = document.createElement("video");
            video.controls = true;
            video.preload = "metadata";
            video.poster = item.poster || project.cover;
            video.setAttribute("playsinline", "");
            video.setAttribute("aria-label", item.alt || project.title);
            const source = document.createElement("source");
            source.src = item.src;
            source.type = "video/mp4";
            const error = document.createElement("p");
            error.className = "detail-media-error";
            error.textContent = "视频加载失败，请检查网络后重试。";
            error.hidden = true;
            const showError = function() { error.hidden = false; };
            video.addEventListener("error", showError);
            source.addEventListener("error", showError);
            video.appendChild(source);
            slide.appendChild(video);
          } else {
            const image = document.createElement("img");
            image.src = item.src;
            image.alt = item.alt || project.title;
            image.loading = index === 0 ? "eager" : "lazy";
            image.addEventListener("error", function() {
              const notice = document.createElement("p");
              notice.className = "detail-media-error";
              notice.textContent = "图片加载失败。";
              slide.appendChild(notice);
            });
            slide.appendChild(image);
          }

          carouselTrack.appendChild(slide);
          carouselSlides.push(slide);

          const dot = document.createElement("button");
          dot.type = "button";
          dot.className = "detail-carousel-dot";
          dot.setAttribute("aria-label", "跳转到第 " + (index + 1) + " 个媒体");
          dot.addEventListener("click", function() { updateCarousel(index); });
          carouselDots.appendChild(dot);
          carouselDotButtons.push(dot);
        });

        if (carouselSlides.length) {
          carouselPrev.hidden = carouselSlides.length < 2;
          carouselNext.hidden = carouselSlides.length < 2;
          carouselDots.hidden = carouselSlides.length < 2;
          carouselPrev.addEventListener("click", function() { updateCarousel(carouselIndex - 1); });
          carouselNext.addEventListener("click", function() { updateCarousel(carouselIndex + 1); });
          carouselRoot.addEventListener("keydown", function(event) {
            if (event.target.closest("video, input, textarea, select, [contenteditable]")) return;
            if (event.key === "ArrowLeft") {
              event.preventDefault();
              updateCarousel(carouselIndex - 1);
            }
            if (event.key === "ArrowRight") {
              event.preventDefault();
              updateCarousel(carouselIndex + 1);
            }
          });

          let swipeStartX = 0;
          let swipeStartY = 0;
          carouselStage.addEventListener("pointerdown", function(event) {
            if (event.target.closest("video, button, a")) return;
            swipeStartX = event.clientX;
            swipeStartY = event.clientY;
          });
          carouselStage.addEventListener("pointerup", function(event) {
            const deltaX = event.clientX - swipeStartX;
            const deltaY = event.clientY - swipeStartY;
            if (Math.abs(deltaX) < 48 || Math.abs(deltaX) < Math.abs(deltaY) * 1.25) return;
            if (deltaX < 0) {
              updateCarousel(carouselIndex + 1);
            } else {
              updateCarousel(carouselIndex - 1);
            }
          });
          updateCarousel(0);
        } else {
          const empty = document.createElement("p");
          empty.className = "detail-empty";
          empty.textContent = "暂无可展示的作品媒体。";
          carouselTrack.appendChild(empty);
          carouselPrev.hidden = true;
          carouselNext.hidden = true;
          carouselDots.hidden = true;
          carouselStatus.textContent = "";
        }

        const metaEl = document.getElementById("detailMeta");
        let metaHtml = "";
        if (project.year) metaHtml += "<div><dt>年份</dt><dd>" + project.year + "</dd></div>";
        if (project.tools && project.tools.length) {
          const toolsHtml = project.tools.map(function(tool) { return "<span>" + tool + "</span>"; }).join("");
          metaHtml += "<div><dt>工具</dt><dd class=\"detail-meta-tools\">" + toolsHtml + "</dd></div>";
        }
        if (project.role) metaHtml += "<div><dt>职责</dt><dd>" + project.role + "</dd></div>";
        if (project.status) metaHtml += "<div><dt>状态</dt><dd>" + project.status + "</dd></div>";
        metaEl.innerHTML = metaHtml || "<div><dt>信息</dt><dd>项目资料正在整理中</dd></div>";

        const modulesEl = document.getElementById("detailModules");
        modulesEl.innerHTML = "";

        const appendHeading = function(parent, text) {
          const heading = document.createElement("h2");
          heading.textContent = text;
          parent.appendChild(heading);
        };

        if (project.modules && project.modules.overview) {
          const overview = project.modules.overview;
          const overviewSection = document.createElement("section");
          overviewSection.className = "detail-module detail-overview";
          appendHeading(overviewSection, overview.label || "PROJECT OVERVIEW / 项目介绍");
          if (overview.body) {
            const text = document.createElement("p");
            text.textContent = overview.body;
            overviewSection.appendChild(text);
          }
          if (Array.isArray(overview.facts) && overview.facts.length) {
            const facts = document.createElement("dl");
            facts.className = "detail-facts";
            overview.facts.forEach(fact => {
              const item = document.createElement("div");
              const label = document.createElement("dt");
              label.textContent = fact.label;
              const value = document.createElement("dd");
              value.textContent = fact.value;
              item.appendChild(label);
              item.appendChild(value);
              facts.appendChild(item);
            });
            overviewSection.appendChild(facts);
          }
          modulesEl.appendChild(overviewSection);
        }

        if (project.modules && project.modules.technical && Array.isArray(project.modules.technical.items) && project.modules.technical.items.length) {
          const technical = project.modules.technical;
          const technicalSection = document.createElement("section");
          technicalSection.className = "detail-module detail-technical";
          appendHeading(technicalSection, technical.label || "TECHNICAL BREAKDOWN / 技术说明");
          const grid = document.createElement("div");
          grid.className = "detail-tech-grid";
          technical.items.forEach(item => {
            const card = document.createElement("article");
            card.className = "detail-tech-card";
            const title = document.createElement("h3");
            title.textContent = item.title;
            card.appendChild(title);
            if (item.body) {
              const body = document.createElement("p");
              body.textContent = item.body;
              card.appendChild(body);
            }
            if (Array.isArray(item.tags) && item.tags.length) {
              const tags = document.createElement("ul");
              tags.className = "detail-tech-tags";
              item.tags.forEach(tag => {
                const li = document.createElement("li");
                li.textContent = tag;
                tags.appendChild(li);
              });
              card.appendChild(tags);
            }
            grid.appendChild(card);
          });
          technicalSection.appendChild(grid);
          modulesEl.appendChild(technicalSection);
        }

        if (project.modules && project.modules.gallery && Array.isArray(project.modules.gallery.items) && project.modules.gallery.items.length) {
          const gallery = project.modules.gallery;
          const gallerySection = document.createElement("section");
          gallerySection.className = "detail-module detail-gallery";
          appendHeading(gallerySection, gallery.label || "GRAPHIC DESIGN ARCHIVE / 平面设计档案");
          if (gallery.intro) {
            const intro = document.createElement("p");
            intro.className = "detail-gallery-intro";
            intro.textContent = gallery.intro;
            gallerySection.appendChild(intro);
          }
          const wall = document.createElement("div");
          wall.className = "detail-gallery-wall";
          gallery.items.forEach(function(gItem, gIdx) {
            const fig = document.createElement("figure");
            fig.className = "detail-gallery-item";
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "detail-gallery-thumb";
            const img = document.createElement("img");
            img.src = gItem.src;
            img.alt = gItem.title || "";
            img.loading = "lazy";
            btn.appendChild(img);
            btn.addEventListener("click", function() { openLightbox(gItem, gallerySection); });
            fig.appendChild(btn);
            const cap = document.createElement("figcaption");
            const num = document.createElement("span");
            num.className = "detail-gallery-num";
            num.textContent = "ARCHIVE " + String(gIdx + 1).padStart(3, "0");
            cap.appendChild(num);
            const name = document.createElement("span");
            name.className = "detail-gallery-name";
            name.textContent = gItem.title || "";
            cap.appendChild(name);
            fig.appendChild(cap);
            wall.appendChild(fig);
          });
          gallerySection.appendChild(wall);
          modulesEl.appendChild(gallerySection);
        }

        if (!modulesEl.children.length) {
          modulesEl.innerHTML = '<p class="detail-empty">作品展示内容正在整理中。</p>';
        }

        const linksSection = document.getElementById("detailLinksSection");
        const linksEl = document.getElementById("detailLinks");
        if (project.links && project.links.length) {
          linksSection.style.display = "";
          linksEl.innerHTML = project.links.map(l =>
            '<a href="' + l.url + '" target="_blank" rel="noopener noreferrer">' + l.label + ' ↗</a>'
          ).join("");
        }

        const idx = projects.findIndex(p => p.slug === slug);
        const prev = projects[idx - 1];
        const next = projects[idx + 1];
        const adjEl = document.getElementById("adjacentNav");
        let adjHtml = "";
        if (prev) adjHtml += '<a class="button secondary" href="./work.html?id=' + prev.slug + '">← ' + prev.title + '</a>';
        if (next) adjHtml += '<a class="button secondary" href="./work.html?id=' + next.slug + '">' + next.title + ' →</a>';
        adjEl.innerHTML = adjHtml;
      })();
    </script>
    <script src="./script.js"></script>
  </body>
</html>
