<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作品集 — YHN® Digital Art Archive</title>
    <meta name="description" content="YHN® 数字媒体作品集 — 完整作品列表" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="scroll-progress" id="scrollProgress"></div>

    <header class="site-header">
      <a class="brand" href="./index.html">
        <span class="brand-mark">YHN</span>
        <span>Archive</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-divider"></div>
      <nav class="top-nav" id="topNav" aria-label="主导航">
        <a href="./index.html"><span class="nav-num">01</span>首页</a>
        <a href="./works.html" class="is-active"><span class="nav-num">02</span>作品集</a>
        <a href="./about.html"><span class="nav-num">03</span>关于</a>
        <a href="./terminal.html"><span class="nav-num">04</span>终端</a>
      </nav>
    </header>

    <div class="sub-nav">
      <a class="back-button" id="backButton" href="./index.html" data-fallback="./index.html">← 返回</a>
      <nav class="breadcrumb" aria-label="页面路径">
        <a href="./index.html"><span class="nav-num">01</span>首页</a>
        <span class="crumb-sep">›</span>
        <span class="crumb-current">作品集</span>
      </nav>
    </div>

    <main class="sub-page" id="top">
      <section class="page-hero">
        <p class="eyebrow">全部作品 / 作品集</p>
        <h1>作品集</h1>
      </section>

      <section class="section works-section">
        <div class="filter-bar" id="filterBar" role="tablist" aria-label="作品分类筛选"></div>
        <div class="work-grid" id="workGrid" aria-live="polite"></div>
        <div class="empty-state" id="emptyState" style="display:none">
          <p>该分类暂无作品。</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span class="footer-brand">YHN® Digital Art Archive</span>
        <span class="footer-note">© 2026 杨蕙咛</span>
      </div>
    </footer>

    <script src="./data.js"></script>
    <script>
      (function() {
        const grid = document.getElementById("workGrid");
        const filterBar = document.getElementById("filterBar");
        const emptyState = document.getElementById("emptyState");

        function renderFilters() {
          filterBar.innerHTML = categories.map((cat, i) =>
            `<button class="filter-button${i === 0 ? " is-active" : ""}" type="button" data-filter="${cat.key}">${cat.label}</button>`
          ).join("");
        }

        function renderGrid(filter) {
          const list = filter === "all" ? projects : projects.filter(p => p.filter === filter || p.category.toLowerCase().includes(filter));
          emptyState.style.display = list.length === 0 ? "" : "none";
          grid.innerHTML = list.map((p, i) => {
            const sizes = ["feature", "wide", "tall", "wide", "tall", "wide"];
            const sizeClass = " work-card--" + sizes[i % sizes.length];
            return '<article class="work-card' + sizeClass + '" tabindex="0" role="link" data-slug="' + p.slug + '">' +
              '<span class="work-thumb">' +
                '<img src="' + p.cover + '" alt="' + p.title + '" loading="lazy" onerror="this.style.display=\'none\'" />' +
                '<span class="card-index">' + String(i + 1).padStart(2, "0") + '</span>' +
              '</span>' +
              '<span class="work-info">' +
                '<span class="eyebrow">' + p.category + '</span>' +
                '<h3>' + p.title + '</h3>' +
                '<p>' + p.summary + '</p>' +
                '<span class="work-arrow">查看项目 →</span>' +
              '</span>' +
            '</article>';
          }).join("");
        }

        filterBar.addEventListener("click", function(e) {
          const btn = e.target.closest(".filter-button");
          if (!btn) return;
          filterBar.querySelectorAll(".filter-button").forEach(b => b.classList.remove("is-active"));
          btn.classList.add("is-active");
          renderGrid(btn.dataset.filter);
          saveWorksFilter(btn.dataset.filter);
        });

        grid.addEventListener("click", function(e) {
          const card = e.target.closest(".work-card");
          if (!card) return;
          const activeBtn = filterBar.querySelector(".filter-button.is-active");
          if (activeBtn) saveWorksFilter(activeBtn.dataset.filter);
          window.location.href = "./work.html?id=" + card.dataset.slug;
        });

        grid.addEventListener("keydown", function(e) {
          if (e.key !== "Enter" && e.key !== " ") return;
          const card = e.target.closest(".work-card");
          if (!card) return;
          e.preventDefault();
          window.location.href = "./work.html?id=" + card.dataset.slug;
        });

        renderFilters();
        const savedFilter = restoreWorksFilter();
        const savedBtn = filterBar.querySelector('[data-filter="' + savedFilter + '"]');
        if (savedBtn && savedFilter !== "all") {
          filterBar.querySelectorAll(".filter-button").forEach(b => b.classList.remove("is-active"));
          savedBtn.classList.add("is-active");
          renderGrid(savedFilter);
        } else {
          renderGrid("all");
        }
      })();
    </script>
    <script src="./script.js"></script>
  </body>
</html>
