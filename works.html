<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作品集 — YHN® Digital Art Archive</title>
    <meta name="description" content="YHN® 数字媒体作品集 — 完整作品列表" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="scroll-progress" id="scrollProgress"></div>

    <header class="site-header">
      <a class="brand" href="./index.html">
        <span class="brand-mark">YHN</span>
        <span>Archive</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-divider"></div>
      <nav class="top-nav" id="topNav" aria-label="主导航">
        <a href="./index.html"><span class="nav-num">01</span>首页</a>
        <a href="./works.html" class="is-active" aria-current="page"><span class="nav-num">02</span>作品集</a>
        <a href="./about.html"><span class="nav-num">03</span>关于</a>
        <a href="./terminal.html"><span class="nav-num">04</span>终端</a>
      </nav>
    </header>

    <main class="sub-page" id="top">
      <section class="page-hero">
        <p class="eyebrow">全部作品 / 作品集</p>
        <h1>作品集</h1>
      </section>

      <section class="section works-section">
        <p class="eyebrow">项目分类 / Categories</p>
        <div class="filter-bar" id="filterBar" role="group" aria-label="作品分类筛选"></div>
        <div class="work-grid" id="workGrid" aria-live="polite"></div>
        <div class="empty-state" id="emptyState" style="display:none">
          <p id="emptyMessage">该分类暂无作品。</p>
          <button class="button secondary" id="clearFilter" type="button">查看全部作品</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span class="footer-brand">YHN® Digital Art Archive</span>
        <span class="footer-note">© 2026 杨蕙咛</span>
      </div>
    </footer>

    <script src="./data.js"></script>
    <script src="./script.js"></script>
    <script>
      (function() {
        const grid = document.getElementById("workGrid");
        const filterBar = document.getElementById("filterBar");
        const emptyState = document.getElementById("emptyState");

        let currentFilter = "all";

        function renderFilters() {
          filterBar.innerHTML = categories.map((cat, i) =>
            `<button class="filter-button${cat.key === "all" ? " is-active" : ""}" type="button" data-filter="${cat.key}" aria-pressed="${cat.key === "all"}">${cat.label}</button>`
          ).join("");
        }

        function updateFilterState(filter) {
          currentFilter = filter;
          filterBar.querySelectorAll(".filter-button").forEach(button => {
            const isActive = button.dataset.filter === filter;
            button.classList.toggle("is-active", isActive);
            button.setAttribute("aria-pressed", String(isActive));
          });
        }

        function renderGrid(filter) {
          const list = filter === "all" ? projects : projects.filter(p => p.filter === filter);
          emptyState.style.display = list.length === 0 ? "" : "none";
          if (list.length === 0) {
            const category = categories.find(cat => cat.key === filter);
            emptyMessage.textContent = (category ? category.label : "当前筛选") + "暂时没有可展示的作品。";
          }
          grid.innerHTML = list.map((p, i) => {
            const sizes = ["feature", "wide", "tall", "wide", "tall", "wide"];
            const sizeClass = " work-card--" + sizes[i % sizes.length];
            const toolsHtml = (p.tools && p.tools.length) ? '<span class="work-tools">' + p.tools.map(function(t) { return '<span>' + t + '</span>'; }).join('') + '</span>' : '';
            return '<article class="work-card' + sizeClass + '" tabindex="0" role="link" data-slug="' + p.slug + '">' +
              '<span class="work-thumb" data-placeholder="true">' +
                '<span class="placeholder-tag">TEMP</span>' +
                '<span class="placeholder-shape" aria-hidden="true"></span>' +
                '<span class="card-index">' + String(i + 1).padStart(2, "0") + '</span>' +
              '</span>' +
              '<span class="work-info">' +
                '<span class="eyebrow">' + p.category + '</span>' +
                '<h3>' + p.title + '</h3>' +
                '<p>' + p.summary + '</p>' +
                toolsHtml +
                '<span class="work-arrow">查看项目 →</span>' +
              '</span>' +
            '</article>';
          }).join("");
        }

        filterBar.addEventListener("click", function(e) {
          const btn = e.target.closest(".filter-button");
          if (!btn) return;
          updateFilterState(btn.dataset.filter);
          renderGrid(btn.dataset.filter);
          saveWorksFilter(btn.dataset.filter);
        });

        clearFilter.addEventListener("click", function() {
          updateFilterState("all");
          renderGrid("all");
          saveWorksFilter("all");
        });

        grid.addEventListener("click", function(e) {
          const card = e.target.closest(".work-card");
          if (!card) return;
          const activeBtn = filterBar.querySelector(".filter-button.is-active");
          if (activeBtn) saveWorksFilter(activeBtn.dataset.filter);
          window.location.href = "./work.html?id=" + card.dataset.slug;
        });

        grid.addEventListener("keydown", function(e) {
          if (e.key !== "Enter" && e.key !== " ") return;
          const card = e.target.closest(".work-card");
          if (!card) return;
          e.preventDefault();
          window.location.href = "./work.html?id=" + card.dataset.slug;
        });

        renderFilters();
        const savedFilter = restoreWorksFilter();
        const savedCategoryExists = categories.some(cat => cat.key === savedFilter);
        const restoredFilter = savedCategoryExists ? savedFilter : "all";
        if (restoredFilter !== "all") {
          updateFilterState(restoredFilter);
          renderGrid(savedFilter);
        } else {
          updateFilterState("all");
          renderGrid("all");
        }
      })();
    </script>
  </body>
</html>
